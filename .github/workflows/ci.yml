name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (§12.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: deny-cache
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.20.2
      - name: Install dependency checker
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Gate regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: No skipped tests or hard-coded renderer styles
        run: python3 scripts/quality.py sources
      - name: Core dependency ban
        run: python3 scripts/quality.py dependencies
      - name: Protect fixture goldens in every commit
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/quality.py fixtures --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Diagnostic fixture and deferral coverage
        run: cargo test --locked -p genui-conformance semantic::audit_tests
  check:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux renderer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libgit2-dev libvulkan-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: GPUI renderer with screenshot support (macOS capture backend)
        if: runner.os == 'macOS'
        run: cargo check -p genui-gpui --features screenshot --locked
      - name: Form demo headless smoke (macOS capture backend)
        if: runner.os == 'macOS'
        run: cargo run --locked -p genui-gpui --features screenshot --bin form-demo -- --self-test
      - name: Unit tests, live conformance and seeded streaming property
        env:
          GENUI_STREAM_CASES: "2000"
        run: cargo test --workspace --locked
      - name: All fixture chunkings
        run: cargo run --locked -p genui-cli -- fixtures
      - name: Specification examples
        run: cargo run --locked -p genui-cli -- spec-check
      - name: Fuzz target format
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Fuzz target build
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  canonical:
    name: Canonical bytes (serde_json preserve_order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libgit2-dev libvulkan-dev
      - name: Identical core and conformance goldens under feature unification
        run: cargo test --locked --workspace --features serde_json/preserve_order
