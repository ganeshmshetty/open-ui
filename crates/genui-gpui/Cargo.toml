[package]
name = "genui-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# No doctest examples; disabling avoids resolving a second workspace's
# genui-core artifact when the mandated shared CARGO_TARGET_DIR is in use.
doctest = false

[features]
default = []
# `Window::render_to_image` capture for the gallery (SPEC §12.7).
# It is a dev-only feature; normal builds of the renderer do not need it.
screenshot = ["gpui-kit/test-support"]

[dependencies]
genui-core.workspace = true
genui-std.workspace = true
genui-prompt.workspace = true
gpui-kit.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
gpui-pre.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# SPEC §12.7 scripted GPUI interaction tests use the kit's headless test
# context. It is a test-only feature; release builds stay on the pinned set.
gpui-kit = { workspace = true, features = ["test-support"] }


[[bin]]
name = "form-demo"
path = "src/bin/form_demo.rs"
